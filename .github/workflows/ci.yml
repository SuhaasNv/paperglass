name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

# Least privilege by default. No job here writes anything.
permissions:
  contents: read

# bash gives -o pipefail: a failing command behind a pipe fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/check_copy.py
      - run: echo "Lint, format, mypy strict and copy rules green" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --dev
      - run: uv run pytest -q --cov --cov-report=term --cov-report=xml
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage (${{ matrix.os }}, py${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=total 2>/dev/null | sed 's/^/Total: /; s/$/ %/' >> "$GITHUB_STEP_SUMMARY" || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Licence check (permissive only)
        run: npx --yes license-checker-rseidelsohn --production --excludePackages "paperglass-frontend@0.2.0-dev" --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;MPL-2.0;0BSD;CC0-1.0;Unlicense;OFL-1.1" --summary >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    env:
      CI: "true"
      APP_ENV: test
      PAPERGLASS_SESSION_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --dev
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Journey at 375, 768 and 1280 px (the Playwright config starts the backend and Vite)
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  backend-postgres:
    name: Backend on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paperglass
          POSTGRES_PASSWORD: paperglass
          POSTGRES_DB: paperglass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paperglass -d paperglass_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      PAPERGLASS_SESSION_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      PAPERGLASS_DATABASE_URL: postgresql+pg8000://paperglass:paperglass@localhost:5432/paperglass_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --dev
      - name: Migrate up and down and up again
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest -q tests/backend

  install:
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Install the wheel into a fresh environment and run the CLI
        run: |
          uv venv fresh
          uv pip install --python fresh dist/*.whl
          if [ "$RUNNER_OS" = "Windows" ]; then ./fresh/Scripts/paperglass version; else ./fresh/bin/paperglass version; fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv export --frozen --no-dev --no-emit-project -o requirements.txt
      - run: uvx pip-audit --strict -r requirements.txt
      - name: Licence check (blocks AGPL and GPL; the full table goes to the summary)
        run: |
          uvx pip-licenses --python .venv/bin/python --fail-on="GNU Affero General Public License v3;GNU Affero General Public License v3 or later (AGPLv3+);GNU General Public License v3 (GPLv3);GNU General Public License v2 (GPLv2);GNU General Public License v3 or later (GPLv3+);GNU General Public License v2 or later (GPLv2+)"
          echo "### Dependency licences" >> "$GITHUB_STEP_SUMMARY"
          uvx pip-licenses --python .venv/bin/python --format=markdown --order=license >> "$GITHUB_STEP_SUMMARY"
